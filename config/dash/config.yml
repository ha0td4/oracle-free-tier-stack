# Homer config for the admin launcher at dash.DOMAIN (a static page of links, no data).
# Edit THIS file. stack.sh fills in {{DOMAIN}} from .env, drops the items whose "# needs: <component>" is not in your
# tier, and writes the result to data/dash/config.yml on every ./stack.sh command; then run ./stack.sh restart homer.
title: "Admin dashboard"
subtitle: "Stack control panel"
header: true
footer: false
columns: "3"
connectivityCheck: false   # cross-origin checks fail behind Cloudflare Access
defaults:
  layout: columns
  colorTheme: auto
theme: default

links:
  - name: "Cloudflare dashboard"
    icon: "fas fa-cloud"
    url: "https://dash.cloudflare.com"
    target: "_blank"
  - name: "Oracle Cloud Console"
    icon: "fas fa-server"
    url: "https://cloud.oracle.com"
    target: "_blank"

services:
  - name: "Automation and AI"
    icon: "fas fa-microchip"
    items:
      # needs: n8n
      - name: "n8n"
        subtitle: "Workflows and webhooks"
        icon: "fas fa-diagram-project"
        url: "https://n8n.{{DOMAIN}}"
        target: "_blank"
      # needs: omniroute
      - name: "OmniRoute"
        subtitle: "AI gateway, providers and API keys"
        icon: "fas fa-route"
        url: "https://ai.{{DOMAIN}}"
        target: "_blank"
      # needs: hermes
      - name: "Hermes"
        subtitle: "Agent dashboard"
        icon: "fas fa-robot"
        url: "https://hermes.{{DOMAIN}}"
        target: "_blank"
      # needs: open-webui
      - name: "Open WebUI"
        subtitle: "Chat page; Admin panel for models and tools"
        icon: "fas fa-comments"
        url: "https://chat.{{DOMAIN}}"
        target: "_blank"

  - name: "Monitoring"
    icon: "fas fa-heart-pulse"
    items:
      # needs: alloy
      - name: "Grafana"
        subtitle: "Hosts, containers, logs and service checks (on the monitoring hub)"
        icon: "fas fa-chart-line"
        url: "https://monitor.{{DOMAIN}}"
        target: "_blank"

  - name: "Identity"
    icon: "fas fa-fingerprint"
    items:
      # needs: pocket-id
      - name: "Pocket ID"
        subtitle: "Users, groups and passkeys"
        icon: "fas fa-fingerprint"
        url: "https://id.{{DOMAIN}}"
        target: "_blank"
